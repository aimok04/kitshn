name: Build flatpak on new version tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  flatpak:
    name: "Build and release flatpak"
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build appImage
        run: ./gradlew :desktopApp:packageAppImage

      - name: Copy appImage
        run: cp -r desktopApp/build/compose/binaries/main/app/kitshn flatpak/source

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kitshn-${{ matrix.arch }}-${{ github.sha }}.flatpak
          manifest-path: flatpak/app.kitshn.kitshn.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Release artifacts
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: kitshn-${{ matrix.arch }}-${{ github.sha }}.flatpak
